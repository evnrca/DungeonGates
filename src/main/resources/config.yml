# DungeonGates Configuration

# Action when player tries to enter next room without completing current
# VELOCITY, TELEPORT, CANCEL, KNOCKBACK
failed-entry:
  action: VELOCITY
  velocity:
    horizontal: 1.5
    vertical: 0.4

messages:
  prefix: "&8[&6Dungeon Gates&8] "
  requirement-not-met: "&cYou need {remaining} more MythicMob kills!"
  progress: "&eProgress: {current}/{required}"
  completed: "&aRoom requirement completed!"

# Dungeon rooms
# Format: region: kills
# Order determines progression: first = first room
rooms:
  # Example:
  # room1: 10
  # room2: 15
  # room3: 20