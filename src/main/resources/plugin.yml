name: DungeonGates
version: 1.0.0
main: com.dungeongates.DungeonGatesPlugin
api-version: 1.21
author: DungeonGates Team
description: Dungeon progression plugin using WorldGuard regions and MythicMobs
load: POSTWORLD

depend:
  - WorldGuard
  - MythicMobs

softdepend:
  - PlaceholderAPI

commands:
  dg:
    description: Main DungeonGates command
    usage: /dg <add|remove|list|status|reset|reload> [args]
    permission: dungeongates.admin
    permission-message: "&cYou do not have permission to use this command."
    aliases: [dungeongates, dungeongate]

permissions:
  dungeongates.admin:
    description: Allows access to all DungeonGates admin commands
    default: op
  dungeongates.status:
    description: Allows checking own dungeon progress
    default: true
  dungeongates.status.others:
    description: Allows checking other players' dungeon progress
    default: op
  dungeongates.reset:
    description: Allows resetting player progress
    default: op